<!DOCTYPE html>
<html>
<head>
    <title>Parent Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eaf4f8, #f6fbff); font-family: 'Segoe UI', sans-serif; }
        .register-card { background: white; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,119,182,0.15); padding: 40px; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-6">
        <div class="register-card">
            <h3 class="text-center text-primary fw-bold mb-4">Parent Registration</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
                <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
                <div class="mb-3"><input type="tel" name="phone" class="form-control" placeholder="Phone" required></div>
                <div class="mb-3"><textarea name="address" class="form-control" placeholder="Address" style="height:100px;"></textarea></div>
                <div class="mb-3"><input type="file" name="photo" class="form-control" accept="image/*"></div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div class="text-center mt-4"><a href="{% url 'home' %}" class="text-primary text-decoration-none">Back to Home</a></div>
        </div>
    </div>
</div>
</body>
</html>
